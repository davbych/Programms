<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка - классическая игра</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 28px;
        }
        
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .score span {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }
        
        canvas {
            border: 3px solid #333;
            border-radius: 10px;
            background-color: #111;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .controls {
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            margin: 5px;
            cursor: pointer;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .direction-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .direction-btn {
            background: #4a5568;
            padding: 10px 20px;
            font-size: 20px;
            min-width: 70px;
        }
        
        .direction-btn:hover {
            background: #667eea;
        }
        
        .game-status {
            margin-top: 15px;
            font-size: 16px;
            color: #666;
        }
        
        .restart-btn {
            background: #48bb78;
            margin-top: 10px;
        }
        
        .restart-btn:hover {
            background: #38a169;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .score-animation {
            animation: pulse 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Змейка</h1>
        <div class="score">
            🍎 Счёт: <span id="score">0</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="startBtn" class="restart-btn">▶ Старт</button>
            <button id="restartBtn" class="restart-btn">🔄 Новая игра</button>
        </div>
        <div class="direction-buttons">
            <button class="direction-btn" data-direction="up">⬆ Вверх</button>
            <button class="direction-btn" data-direction="left">⬅ Влево</button>
            <button class="direction-btn" data-direction="down">⬇ Вниз</button>
            <button class="direction-btn" data-direction="right">➡ Вправо</button>
        </div>
        <div class="game-status" id="gameStatus">
            Нажмите "Старт" чтобы начать игру
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameStatusElement = document.getElementById('gameStatus');
        
        // Параметры игры
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [];
        let direction = 'right';
        let nextDirection = 'right';
        let food = {};
        let score = 0;
        let gameRunning = false;
        let gameLoop = null;
        
        // Инициализация игры
        function initGame() {
            // Начальная змейка (3 сегмента)
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            updateScoreDisplay();
            generateFood();
            gameRunning = true;
            gameStatusElement.textContent = 'Игра идёт! 🎮';
            gameStatusElement.style.color = '#48bb78';
            
            // Очищаем предыдущий интервал если есть
            if (gameLoop) {
                clearInterval(gameLoop);
            }
            
            // Запускаем игровой цикл
            gameLoop = setInterval(gameUpdate, 100);
            
            // Рисуем первый кадр
            drawGame();
        }
        
        // Генерация еды на свободной клетке
        function generateFood() {
            const maxAttempts = 1000;
            for (let i = 0; i < maxAttempts; i++) {
                const randomX = Math.floor(Math.random() * tileCount);
                const randomY = Math.floor(Math.random() * tileCount);
                
                // Проверяем, не находится ли еда на змейке
                let isOnSnake = false;
                for (let segment of snake) {
                    if (segment.x === randomX && segment.y === randomY) {
                        isOnSnake = true;
                        break;
                    }
                }
                
                if (!isOnSnake) {
                    food = {x: randomX, y: randomY};
                    return;
                }
            }
            
            // Если долго не можем найти место (почти победа), ищем вручную
            for (let y = 0; y < tileCount; y++) {
                for (let x = 0; x < tileCount; x++) {
                    let isOnSnake = false;
                    for (let segment of snake) {
                        if (segment.x === x && segment.y === y) {
                            isOnSnake = true;
                            break;
                        }
                    }
                    if (!isOnSnake) {
                        food = {x: x, y: y};
                        return;
                    }
                }
            }
            
            // Если все клетки заняты - победа!
            gameWin();
        }
        
        // Обновление счета
        function updateScoreDisplay() {
            scoreElement.textContent = score;
            // Анимация счета
            scoreElement.parentElement.classList.add('score-animation');
            setTimeout(() => {
                scoreElement.parentElement.classList.remove('score-animation');
            }, 300);
        }
        
        // Движение змейки
        function moveSnake() {
            // Применяем следующее направление
            direction = nextDirection;
            
            // Вычисляем новую голову
            let newHead = {...snake[0]};
            
            switch(direction) {
                case 'right':
                    newHead.x += 1;
                    break;
                case 'left':
                    newHead.x -= 1;
                    break;
                case 'up':
                    newHead.y -= 1;
                    break;
                case 'down':
                    newHead.y += 1;
                    break;
            }
            
            // Проверка на съедание еды
            const willEat = (newHead.x === food.x && newHead.y === food.y);
            
            // Добавляем новую голову
            snake.unshift(newHead);
            
            // Если не съели еду, удаляем хвост
            if (!willEat) {
                snake.pop();
            } else {
                // Съели еду - увеличиваем счет и генерируем новую
                score++;
                updateScoreDisplay();
                generateFood();
            }
            
            return willEat;
        }
        
        // Проверка столкновений
        function checkCollision() {
            const head = snake[0];
            
            // Столкновение со стенами
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            // Столкновение с самим собой
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }
        
        // Победа!
        function gameWin() {
            gameRunning = false;
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
            gameStatusElement.textContent = '🏆 ПОБЕДА! 🏆 Вы заполнили всё поле! Нажмите "Новая игра"';
            gameStatusElement.style.color = '#f6ad55';
            drawGame();
        }
        
        // Конец игры
        function gameOver() {
            gameRunning = false;
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
            gameStatusElement.textContent = `💀 ИГРА ОКОНЧЕНА! 💀 Счёт: ${score}. Нажмите "Новая игра"`;
            gameStatusElement.style.color = '#fc8181';
            drawGame();
        }
        
        // Обновление игры (вызывается по таймеру)
        function gameUpdate() {
            if (!gameRunning) return;
            
            moveSnake();
            
            if (checkCollision()) {
                gameOver();
            }
            
            drawGame();
        }
        
        // Отрисовка игры
        function drawGame() {
            // Очищаем canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем сетку (опционально)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // Рисуем еду
            ctx.fillStyle = '#ff4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0000';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
            
            // Рисуем змейку
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                // Градиент для змейки
                const gradient = ctx.createLinearGradient(
                    segment.x * gridSize, 
                    segment.y * gridSize,
                    (segment.x + 1) * gridSize, 
                    (segment.y + 1) * gridSize
                );
                
                if (i === 0) {
                    // Голова
                    gradient.addColorStop(0, '#4ade80');
                    gradient.addColorStop(1, '#22c55e');
                    ctx.fillStyle = gradient;
                } else {
                    // Тело
                    gradient.addColorStop(0, '#3b82f6');
                    gradient.addColorStop(1, '#2563eb');
                    ctx.fillStyle = gradient;
                }
                
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
                
                // Рисуем глаза на голове
                if (i === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    if (direction === 'right') {
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction === 'left') {
                        ctx.fillRect(segment.x * gridSize + eyeOffset - eyeSize, segment.y * gridSize + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + eyeOffset - eyeSize, segment.y * gridSize + gridSize - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction === 'up') {
                        ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset - eyeSize, segment.y * gridSize + eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (direction === 'down') {
                        ctx.fillRect(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + gridSize - eyeOffset - eyeSize, segment.y * gridSize + gridSize - eyeOffset, eyeSize, eyeSize);
                    }
                }
            }
            
            ctx.shadowBlur = 0;
            
            // Если игра не активна, показываем overlay
            if (!gameRunning && gameLoop === null) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2);
            }
        }
        
        // Изменение направления
        function changeDirection(newDirection) {
            if (!gameRunning) return;
            
            // Запрещаем разворот на 180 градусов
            if ((newDirection === 'right' && direction === 'left') ||
                (newDirection === 'left' && direction === 'right') ||
                (newDirection === 'up' && direction === 'down') ||
                (newDirection === 'down' && direction === 'up')) {
                return;
            }
            
            nextDirection = newDirection;
        }
        
        // Остановка игры
        function stopGame() {
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
            gameRunning = false;
            gameStatusElement.textContent = 'Игра остановлена. Нажмите "Старт"';
            gameStatusElement.style.color = '#f6ad55';
            drawGame();
        }
        
        // Обработчики событий
        document.getElementById('startBtn').addEventListener('click', () => {
            if (gameRunning) {
                stopGame();
            } else {
                if (gameLoop) {
                    clearInterval(gameLoop);
                }
                initGame();
            }
        });
        
        document.getElementById('restartBtn').addEventListener('click', () => {
            if (gameLoop) {
                clearInterval(gameLoop);
            }
            initGame();
        });
        
        // Управление кнопками
        document.querySelectorAll('.direction-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const direction = e.target.getAttribute('data-direction');
                changeDirection(direction);
            });
        });
        
        // Управление с клавиатуры
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowUp') changeDirection('up');
            else if (key === 'ArrowDown') changeDirection('down');
            else if (key === 'ArrowLeft') changeDirection('left');
            else if (key === 'ArrowRight') changeDirection('right');
            else if (key === ' ' || key === 'Space') {
                e.preventDefault();
                if (gameRunning) {
                    stopGame();
                } else {
                    if (gameLoop) {
                        clearInterval(gameLoop);
                    }
                    initGame();
                }
            }
        });
        
        // Инициализация при загрузке
        initGame();
    </script>
</body>
</html>
