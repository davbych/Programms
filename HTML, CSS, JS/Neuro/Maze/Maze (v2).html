<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор лабиринта (алгоритм Эллера)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #333;
        }
        .container {
            text-align: center;
            color: white;
            max-width: 800px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        #solveButton {
            background-color: #2196F3;
        }
        #solveButton:hover {
            background-color: #1976D2;
        }
        canvas {
            border: 2px solid white;
            margin-top: 20px;
            background-color: white;
        }
        label {
            margin-right: 10px;
            font-size: 14px;
        }
        input[type="number"] {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            width: 60px;
        }
        .controls {
            margin: 15px 0;
        }
        .info {
            font-size: 14px;
            margin-top: 10px;
            color: #aaa;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .stats {
            margin-top: 10px;
            font-size: 14px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Генератор лабиринта - Алгоритм Эллера</h1>
        <div class="controls">
            <button id="generateButton">Сгенерировать лабиринт</button>
            <button id="solveButton">Показать решение</button>
        </div>
        <canvas id="mazeCanvas" width="400" height="400"></canvas>
        <div>
            <label for="sizeInput">Размер лабиринта:</label>
            <input type="number" id="sizeInput" value="20" min="10" max="50">
            <label for="speedInput">Скорость анимации:</label>
            <input type="number" id="speedInput" value="50" min="0" max="200">
        </div>
        <div class="stats" id="stats"></div>
        <div class="info">
            Алгоритм Эллера создаёт идеальные лабиринты построчно, что делает его очень эффективным для генерации больших лабиринтов. Каждая строка обрабатывается отдельно, и алгоритму не требуется хранить в памяти весь лабиринт во время генерации.
        </div>
    </div>
    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const generateButton = document.getElementById('generateButton');
        const solveButton = document.getElementById('solveButton');
        const sizeInput = document.getElementById('sizeInput');
        const speedInput = document.getElementById('speedInput');
        const statsElement = document.getElementById('stats');

        let mazeSize = parseInt(sizeInput.value);
        let cellSize;
        let maze = [];
        let solutionPath = [];

        // Класс для генерации лабиринта алгоритмом Эллера
        class EllerMazeGenerator {
            constructor(width, height) {
                this.width = width;
                this.height = height;
                this.maze = Array(height * 2 + 1).fill().map(() => Array(width * 2 + 1).fill(1));
                this.currentRow = 0;
                this.sets = {};
                this.nextSetId = 0;
            }

            // Получить новый уникальный идентификатор множества
            getNewSetId() {
                return ++this.nextSetId;
            }

            // Генерация одной строки лабиринта
            generateRow(rowIndex) {
                const y = rowIndex * 2 + 1;
                
                // Инициализация строки
                if (rowIndex === 0) {
                    // Первая строка - все клетки в разных множествах
                    for (let x = 1; x < this.width * 2; x += 2) {
                        this.maze[y][x] = 0;
                        const setId = this.getNewSetId();
                        this.sets[x] = setId;
                    }
                } else {
                    // Для последующих строк копируем множества сверху, где нет стенки
                    for (let x = 1; x < this.width * 2; x += 2) {
                        if (this.maze[y-1][x] === 0) {
                            this.maze[y][x] = 0;
                            this.sets[x] = this.sets[x];
                        } else {
                            this.maze[y][x] = 0;
                            const setId = this.getNewSetId();
                            this.sets[x] = setId;
                        }
                    }
                }

                // Создание вертикальных связей (правые стенки)
                for (let x = 1; x < (this.width - 1) * 2; x += 2) {
                    const currentSet = this.sets[x];
                    const nextSet = this.sets[x + 2];
                    
                    // Решаем, убирать ли стенку между клетками
                    if (currentSet !== nextSet && Math.random() > 0.5) {
                        // Убираем стенку
                        this.maze[y][x + 1] = 0;
                        // Объединяем множества
                        for (let i = 1; i < this.width * 2; i += 2) {
                            if (this.sets[i] === nextSet) {
                                this.sets[i] = currentSet;
                            }
                        }
                    }
                }

                // Создание горизонтальных связей (нижние стенки)
                if (rowIndex < this.height - 1) {
                    const rowSets = {};
                    
                    // Группируем клетки по множествам
                    for (let x = 1; x < this.width * 2; x += 2) {
                        const setId = this.sets[x];
                        if (!rowSets[setId]) {
                            rowSets[setId] = [];
                        }
                        rowSets[setId].push(x);
                    }
                    
                    // Для каждого множества создаем хотя бы одну горизонтальную связь
                    for (const setId in rowSets) {
                        const cells = rowSets[setId];
                        // Перемешиваем клетки множества
                        cells.sort(() => Math.random() - 0.5);
                        
                        // Определяем, сколько связей создать (хотя бы одну)
                        const connections = Math.max(1, Math.floor(Math.random() * cells.length));
                        
                        for (let i = 0; i < connections && i < cells.length; i++) {
                            const x = cells[i];
                            this.maze[y + 1][x] = 0;
                        }
                    }
                } else {
                    // Последняя строка - соединяем все множества
                    for (let x = 1; x < (this.width - 1) * 2; x += 2) {
                        if (this.sets[x] !== this.sets[x + 2]) {
                            this.maze[y][x + 1] = 0;
                            const nextSet = this.sets[x + 2];
                            for (let i = 1; i < this.width * 2; i += 2) {
                                if (this.sets[i] === nextSet) {
                                    this.sets[i] = this.sets[x];
                                }
                            }
                        }
                    }
                }
                
                return y;
            }

            // Полная генерация лабиринта
            generate() {
                // Генерируем строки одна за другой
                for (let row = 0; row < this.height; row++) {
                    this.generateRow(row);
                }
                
                // Создаем вход и выход
                this.maze[1][0] = 0; // Вход слева
                this.maze[this.height * 2 - 1][this.width * 2] = 0; // Выход справа
                
                return this.maze;
            }
        }

        // Упрощенный генератор лабиринта для демонстрации
        function generateMazeEller(width, height) {
            // Создаем массив для лабиринта (1 - стена, 0 - проход)
            const maze = Array(height * 2 + 1).fill().map(() => Array(width * 2 + 1).fill(1));
            
            // Множества для каждой колонки
            let sets = new Array(width).fill(0);
            let nextSetId = 1;
            
            for (let row = 0; row < height; row++) {
                const y = row * 2 + 1;
                
                // Шаг 1: Присваиваем множества
                for (let x = 0; x < width; x++) {
                    const mazeX = x * 2 + 1;
                    if (sets[x] === 0) {
                        sets[x] = nextSetId++;
                    }
                    maze[y][mazeX] = 0; // Открываем клетку
                }
                
                // Шаг 2: Создаем вертикальные соединения (правые стенки)
                for (let x = 0; x < width - 1; x++) {
                    const mazeX = x * 2 + 1;
                    
                    // Не соединяем если уже в одном множестве или случайное решение
                    if (sets[x] !== sets[x + 1] && (row === height - 1 || Math.random() > 0.5)) {
                        maze[y][mazeX + 1] = 0; // Убираем стенку справа
                        
                        // Объединяем множества
                        const setToMerge = sets[x + 1];
                        for (let i = 0; i < width; i++) {
                            if (sets[i] === setToMerge) {
                                sets[i] = sets[x];
                            }
                        }
                    }
                }
                
                // Шаг 3: Создаем горизонтальные соединения (нижние стенки)
                if (row < height - 1) {
                    // Группируем колонки по множествам
                    const setsMap = {};
                    for (let x = 0; x < width; x++) {
                        if (!setsMap[sets[x]]) {
                            setsMap[sets[x]] = [];
                        }
                        setsMap[sets[x]].push(x);
                    }
                    
                    // Для каждого множества создаем хотя бы одну горизонтальную связь
                    for (const setId in setsMap) {
                        const columns = setsMap[setId];
                        // Перемешиваем колонки
                        columns.sort(() => Math.random() - 0.5);
                        
                        // Определяем сколько связей создать
                        const connections = Math.max(1, Math.floor(Math.random() * columns.length) + 1);
                        
                        for (let i = 0; i < Math.min(connections, columns.length); i++) {
                            const x = columns[i];
                            const mazeX = x * 2 + 1;
                            maze[y + 1][mazeX] = 0; // Убираем стенку снизу
                        }
                    }
                    
                    // Сброс множеств для следующей строки (только для клеток без нижней связи)
                    const newSets = new Array(width).fill(0);
                    for (let x = 0; x < width; x++) {
                        const mazeX = x * 2 + 1;
                        if (maze[y + 1][mazeX] === 0) {
                            // Сохраняем множество если есть связь вниз
                            newSets[x] = sets[x];
                        }
                    }
                    sets = newSets;
                }
            }
            
            // Создаем вход и выход
            maze[1][0] = 0; // Вход слева
            maze[height * 2 - 1][width * 2] = 0; // Выход справа
            
            return maze;
        }

        // Решение лабиринта с помощью BFS
        function solveMaze(maze) {
            const height = maze.length;
            const width = maze[0].length;
            
            // Находим координаты входа и выхода
            let start = null, end = null;
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if ((x === 0 || x === width - 1 || y === 0 || y === height - 1) && maze[y][x] === 0) {
                        if (start === null) start = {x, y};
                        else end = {x, y};
                    }
                }
            }
            
            if (!start || !end) {
                start = {x: 1, y: 1};
                end = {x: width - 2, y: height - 2};
            }
            
            // BFS для поиска пути
            const queue = [start];
            const visited = Array(height).fill().map(() => Array(width).fill(false));
            const parent = Array(height).fill().map(() => Array(width).fill(null));
            
            visited[start.y][start.x] = true;
            
            const directions = [
                {dx: 1, dy: 0},  // вправо
                {dx: -1, dy: 0}, // влево
                {dx: 0, dy: 1},  // вниз
                {dx: 0, dy: -1}  // вверх
            ];
            
            while (queue.length > 0) {
                const current = queue.shift();
                
                // Если достигли выхода
                if (current.x === end.x && current.y === end.y) {
                    // Восстанавливаем путь
                    const path = [];
                    let node = current;
                    
                    while (node) {
                        path.unshift(node);
                        node = parent[node.y][node.x];
                    }
                    
                    return path;
                }
                
                // Проверяем соседей
                for (const dir of directions) {
                    const nx = current.x + dir.dx;
                    const ny = current.y + dir.dy;
                    
                    if (nx >= 0 && nx < width && ny >= 0 && ny < height && 
                        maze[ny][nx] === 0 && !visited[ny][nx]) {
                        visited[ny][nx] = true;
                        parent[ny][nx] = current;
                        queue.push({x: nx, y: ny});
                    }
                }
            }
            
            return []; // Путь не найден
        }

        function generateMaze() {
            mazeSize = parseInt(sizeInput.value);
            mazeSize = Math.max(5, Math.min(50, mazeSize)); // Ограничение размера
            cellSize = Math.min(canvas.width, canvas.height) / (mazeSize * 2 + 1);
            
            // Генерируем лабиринт алгоритмом Эллера
            maze = generateMazeEller(mazeSize, mazeSize);
            
            // Очищаем предыдущее решение
            solutionPath = [];
            
            // Обновляем статистику
            const wallCount = maze.flat().filter(cell => cell === 1).length;
            const pathCount = maze.flat().filter(cell => cell === 0).length;
            statsElement.textContent = `Размер: ${mazeSize}x${mazeSize} | Стен: ${wallCount} | Проходов: ${pathCount}`;
            
            // Рисуем лабиринт
            drawMaze();
        }

        function drawMaze() {
            if (!maze || maze.length === 0) return;
            
            const width = maze[0].length;
            const height = maze.length;
            
            // Очищаем canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Масштабируем для отображения всего лабиринта
            const scale = Math.min(canvas.width / width, canvas.height / height);
            const offsetX = (canvas.width - width * scale) / 2;
            const offsetY = (canvas.height - height * scale) / 2;
            
            // Рисуем лабиринт
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (maze[y][x] === 1) {
                        ctx.fillStyle = '#2c3e50'; // Стены
                        ctx.fillRect(offsetX + x * scale, offsetY + y * scale, scale, scale);
                    } else {
                        ctx.fillStyle = '#ecf0f1'; // Проходы
                        ctx.fillRect(offsetX + x * scale, offsetY + y * scale, scale, scale);
                    }
                }
            }
            
            // Рисуем вход и выход
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(offsetX + 0.2 * scale, offsetY + 1 * scale + 0.2 * scale, 0.6 * scale, 0.6 * scale);
            
            ctx.fillStyle = '#2ecc71';
            const exitX = width - 1;
            const exitY = height - 2;
            ctx.fillRect(offsetX + exitX * scale + 0.2 * scale, offsetY + exitY * scale + 0.2 * scale, 0.6 * scale, 0.6 * scale);
            
            // Рисуем решение, если есть
            if (solutionPath.length > 0) {
                drawSolution(scale, offsetX, offsetY);
            }
        }

        function drawSolution(scale, offsetX, offsetY) {
            if (solutionPath.length < 2) return;
            
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.8)';
            ctx.lineWidth = Math.max(2, scale / 3);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(
                offsetX + solutionPath[0].x * scale + scale / 2,
                offsetY + solutionPath[0].y * scale + scale / 2
            );
            
            for (let i = 1; i < solutionPath.length; i++) {
                ctx.lineTo(
                    offsetX + solutionPath[i].x * scale + scale / 2,
                    offsetY + solutionPath[i].y * scale + scale / 2
                );
            }
            
            ctx.stroke();
            
            // Рисуем точки на ключевых позициях
            ctx.fillStyle = '#3498db';
            for (let i = 0; i < solutionPath.length; i += Math.max(1, Math.floor(solutionPath.length / 10))) {
                const point = solutionPath[i];
                ctx.beginPath();
                ctx.arc(
                    offsetX + point.x * scale + scale / 2,
                    offsetY + point.y * scale + scale / 2,
                    scale / 4,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
        }

        function solveAndDraw() {
            if (!maze || maze.length === 0) return;
            
            const speed = parseInt(speedInput.value);
            
            if (speed > 0) {
                // Анимация решения
                solutionPath = [];
                const fullPath = solveMaze(maze);
                
                if (fullPath.length === 0) {
                    statsElement.textContent += ' | Решение не найдено!';
                    return;
                }
                
                let i = 0;
                function animateSolution() {
                    if (i < fullPath.length) {
                        solutionPath.push(fullPath[i]);
                        i++;
                        drawMaze();
                        setTimeout(animateSolution, speed);
                    } else {
                        statsElement.textContent += ` | Длина пути: ${fullPath.length} шагов`;
                    }
                }
                
                animateSolution();
            } else {
                // Мгновенное решение
                solutionPath = solveMaze(maze);
                
                if (solutionPath.length === 0) {
                    statsElement.textContent += ' | Решение не найдено!';
                } else {
                    statsElement.textContent += ` | Длина пути: ${solutionPath.length} шагов`;
                    drawMaze();
                }
            }
        }

        // Обработчики событий
        generateButton.addEventListener('click', generateMaze);
        solveButton.addEventListener('click', solveAndDraw);
        sizeInput.addEventListener('input', generateMaze);
        speedInput.addEventListener('input', () => {
            // Обновляем значение при изменении
            speedInput.value = Math.max(0, Math.min(200, parseInt(speedInput.value) || 50));
        });

        // Генерируем лабиринт при загрузке страницы
        window.onload = generateMaze;
        
        // Адаптивный размер canvas
        function resizeCanvas() {
            const container = document.querySelector('.container');
            const maxSize = Math.min(600, window.innerWidth - 100, window.innerHeight - 300);
            canvas.width = maxSize;
            canvas.height = maxSize;
            generateMaze();
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
</body>
</html>
