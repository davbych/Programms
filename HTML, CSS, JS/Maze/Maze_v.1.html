<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мгновенный лабиринт</title>
  <style>
    body {
      text-align: center;
      margin-top: 50px;
      font-family: Arial, sans-serif;
      background: #525151;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      background: #212136;
      color: rgb(146, 146, 146);
      border: none;
      border-radius: 6px;
    }
    button:hover {
      background: #357abd;
    }
    canvas {
      border: 2px solid #333;
      margin-top: 20px;
      background: black;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>
  <h2>Лабиринт: мгновенная генерация и решение</h2>
  <button onclick="generateAndSolve()">Сгенерировать и решить</button>
  <canvas id="mazeCanvas" width="600" height="600"></canvas>

  <script>
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const size = 31; // Нечётное — важно для лабиринта
    let cell = Math.floor(canvas.width / size);

    let grid = [];
    let start = { x: 1, y: 1 };
    let end = { x: size - 2, y: size - 2 };

    function initGrid() {
      grid = Array(size).fill().map(() => Array(size).fill(true));
    }

    function clearCanvas() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawCell(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }

    function inBounds(x, y) {
      return x >= 0 && x < size && y >= 0 && y < size;
    }

    // Исправленная генерация лабиринта с гарантированной связностью
    function generateMaze() {
      const stack = [];
      const visited = Array(size).fill().map(() => Array(size).fill(false)); // Отслеживаем посещённые клетки
      const directions = [[-2, 0], [2, 0], [0, -2], [0, 2]]; // Движение с пропуском стены

      // Начальная точка
      grid[start.y][start.x] = false;
      visited[start.y][start.x] = true;
      stack.push(start.x, start.y);

      while (stack.length > 0) {
        const y = stack.pop();
        const x = stack.pop();

        const validDirs = [];
        for (const [dx, dy] of directions) {
          const nx = x + dx, ny = y + dy;
          const wx = x + dx / 2, wy = y + dy / 2;
          if (inBounds(nx, ny) && !visited[ny][nx]) { // Проверяем, не посещена ли клетка
            validDirs.push([dx, dy, wx, wy, nx, ny]);
          }
        }

        if (validDirs.length > 0) {
          stack.push(x, y); // Сохраняем текущую позицию для возврата

          // Случайный выбор направления
          const [dx, dy, wx, wy, nx, ny] = validDirs[Math.floor(Math.random() * validDirs.length)];

          // Разрушаем стену и открываем проход
          grid[wy][wx] = false;
          grid[ny][nx] = false;
          visited[ny][nx] = true; // Отмечаем клетку как посещённую

          stack.push(nx, ny); // Добавляем новую позицию для продолжения
        }
      }
    }

    function findPath() {
      const visited = new Set();
      const stack = [{ x: start.x, y: start.y, path: [] }];
      const key = (x, y) => `${x},${y}`;

      while (stack.length > 0) {
        const { x, y, path } = stack.pop();
        const k = key(x, y);

        if (visited.has(k)) continue;
        visited.add(k);

        if (x === end.x && y === end.y) {
          return [...path, { x, y }];
        }

        const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (const [dx, dy] of directions) {
          const nx = x + dx, ny = y + dy;
          const nk = key(nx, ny);
          if (inBounds(nx, ny) && !grid[ny][nx] && !visited.has(nk)) {
            stack.push({ x: nx, y: ny, path: [...path, { x, y }] });
          }
        }
      }
      return []; // Путь не найден
    }

    function generateAndSolve() {
      cell = Math.floor(canvas.width / size);
      initGrid();
      clearCanvas();

      // 1. Генерация связного лабиринта
      generateMaze();

      // 2. Проверка связности: убеждаемся, что финиш доступен
      const path = findPath();
      if (path.length === 0) {
        console.log("Нет пути! Перегенерируем...");
        generateAndSolve(); // Перезапуск генерации, если путь не найден
        return;
      }

      // 3. Рисуем все проходы серым
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (!grid[y][x]) {
            drawCell(x, y, 'lightgray');
          }
        }
      }

      // 4. Ставим старт и финиш (гарантированно в доступных зонах)
      drawCell(start.x, start.y, 'red');
      drawCell(end.x, end.y, 'green');

      // 5. Ищем и рисуем путь красным
      for (const { x, y } of path) {
        drawCell(x, y, 'grey');
      }

      // 6. Возвращаем старт и финиш поверх пути
      drawCell(start.x, start.y, 'darkred');
      drawCell(end.x, end.y, 'darkgreen');
    }
  </script>
</body>
</html>
