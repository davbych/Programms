<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Генератор персонажей | Судьба, внешность и характер</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Georgia', serif;
            padding: 2rem;
        }

        .card {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 2rem;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 2rem;
            align-items: flex-start;
        }

        .name-box {
            flex: 2;
            min-width: 220px;
        }

        .age-box {
            flex: 1;
            min-width: 140px;
            text-align: right;
        }

        .full-name {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            word-break: break-word;
        }

        .age-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #facc15;
            background: #1e293b;
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 60px;
            box-shadow: inset 0 -1px 0 #334155, 0 8px 20px rgba(0,0,0,0.3);
            line-height: 1.3;
        }

        .age-label {
            font-size: 1rem;
            color: #cbd5e1;
            margin-top: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            justify-content: space-between;
            align-items: center;
        }

        .generate-btn {
            background: #f97316;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(249,115,22,0.3);
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
        }

        .generate-btn:hover {
            background: #ea580c;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(249,115,22,0.4);
        }

        .toggle-midname {
            background: #334155;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            color: #f1f5f9;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #f97316;
        }

        .traits-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .trait-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 1.5rem;
            padding: 0.8rem 1.2rem;
            flex: 1 1 200px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .trait-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #facc15;
            margin-bottom: 0.4rem;
        }

        .trait-value {
            font-size: 1rem;
            font-weight: 500;
            color: #f1f5f9;
            word-break: break-word;
        }

        .story-container {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 2rem;
            padding: 1.8rem;
            margin-top: 0.8rem;
            border-left: 6px solid #facc15;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 8px 20px rgba(0,0,0,0.2);
        }

        .story-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #facc15;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .story-text {
            font-size: 1rem;
            line-height: 1.55;
            color: #e2e8f0;
            text-align: justify;
            font-family: 'Georgia', serif;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        @media (max-width: 700px) {
            body { padding: 1rem; }
            .card { padding: 1.2rem; }
            .full-name { font-size: 1.6rem; }
            .age-number { font-size: 1.8rem; padding: 0.1rem 1rem; }
            .name-box, .age-box { text-align: center; flex: auto; }
            .header-stats { justify-content: center; text-align: center; }
            .age-box { text-align: center; }
            .traits-grid { flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="controls">
        <button class="generate-btn" id="generateBtn">✨ Сгенерировать нового человека</button>
        <label class="toggle-midname">
            <input type="checkbox" id="includeMiddleCheckbox"> Включить отчество (middle name)
        </label>
    </div>

    <div class="header-stats">
        <div class="name-box">
            <div class="full-name" id="fullName">John Doe</div>
        </div>
        <div class="age-box">
            <div class="age-number" id="ageValue">42</div>
            <div class="age-label">years old</div>
        </div>
    </div>

    <div class="traits-grid" id="traitsGrid">
        <div class="trait-card"><div class="trait-label">💼 Профессия</div><div class="trait-value" id="profession">—</div></div>
        <div class="trait-card"><div class="trait-label">🎨 Хобби</div><div class="trait-value" id="hobby">—</div></div>
        <div class="trait-card"><div class="trait-label">🧠 Характер</div><div class="trait-value" id="personality">—</div></div>
        <div class="trait-card"><div class="trait-label">👁️ Внешность</div><div class="trait-value" id="appearance">—</div></div>
    </div>

    <div class="story-container">
        <div class="story-title">📜 Жизненный путь</div>
        <div class="story-text" id="storyText">
            Здесь появится уникальная история человека — от рождения до последних дней.
        </div>
    </div>
    <footer>⚡ Каждый клик — новая судьба. Отчество, профессия, хобби, характер и внешность генерируются автоматически.</footer>
</div>

        "увлекалась спортом и мечтала стать профессионалом",

    ];
    
    const EDUCATION_MASC = [

    const JOBS_MASC = [

    ];
    const JOBS_FEM = [

        "была водителем грузовика", "работала на заводе", "стала художницей-фрилансером", "работала в офисе менеджером",
        "занималась строительством", "работала поваром в известном ресторане"
    ];
    
    const FAMILY_MASC = [
        { text: "женился и родил двоих детей", minAge: 22, hasChildren: true },
        { text: "остался в браке на долгие годы, воспитав троих детей", minAge: 28, hasChildren: true },

    ];

    function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function generateName(includeMiddle) {
        const isFemale = Math.random() < 0.5;
        const firstName = isFemale ? randomItem(FIRST_NAMES_FEMALE) : randomItem(FIRST_NAMES_MALE);
        const lastName = randomItem(LAST_NAMES);
        let middle = "";
        if (includeMiddle) {
            let middlePool = isFemale ? MIDDLE_NAMES.filter(n => ["Marie","Ann","Grace","Rose","Elizabeth","Lynn","Nicole","Michelle","Renee","Louise"].includes(n)) : MIDDLE_NAMES;
            if (middlePool.length === 0) middlePool = MIDDLE_NAMES;
            middle = " " + randomItem(middlePool);
        }
        return { full: firstName + middle + " " + lastName, firstName, lastName, isFemale };
    }

    function generateAgeAndDeath() {
        let age = Math.floor(Math.random() * 121);
        let died = false;
        if (age >= 18) {
            const deathChance = age > 90 ? 0.85 : (age > 70 ? 0.6 : 0.3);
            if (Math.random() < deathChance) {
                died = true;
                let deathAge = Math.min(age, 70 + Math.floor(Math.random() * 45));
                age = deathAge;
            }
        }
        return { age, died };
    }

    function generateProfession(age, gender) {
        if (age < 7) return "ребёнок (дошкольник)";
        if (age < 18) return randomItem(PROFESSIONS_TEEN);
        if (gender === "male") return randomItem(PROFESSIONS_ADULT_MASC);
        else return randomItem(PROFESSIONS_ADULT_FEM);
    }

    function generateHobby(age) {
        if (age < 3) return "младенческие игры";
        if (age < 7) return randomItem(["рисование", "лепка", "просмотр мультфильмов"]);
        return randomItem(HOBBIES);
    }

    function generatePersonality() { return randomItem(PERSONALITY_TRAITS); }
    
    function generateAppearance(age) {
        const eyes = randomItem(EYE_COLORS);
        let hairColor = randomItem(HAIR_COLORS);
        if (age < 5) hairColor = "светлые (младенческие)";
        const hairType = randomItem(HAIR_TYPES);
        const build = (age < 12) ? "детское" : randomItem(BUILD);
        return `${build} телосложение, ${hairColor} ${hairType} волосы, ${eyes} глаза`;
    }

    function generateStory(firstName, lastName, gender, age, died, profession) {
        const isMale = (gender === "male");
        const pronounHe = isMale ? "он" : "она";
        const pronounHis = isMale ? "его" : "её";
        const pronounHim = isMale ? "ему" : "ей";
        const wasBorn = isMale ? "родился" : "родилась";
        
        const birthPlace = randomItem(BIRTH_PLACES);
        
        // Базовое начало: рождение
        let story = `${firstName} ${lastName} ${wasBorn} ${birthPlace}. `;
        
        // Детство (только если возраст >= 1 год)
        if (age >= 1) {
            const childhood = randomItem(isMale ? CHILDHOOD_MASC : CHILDHOOD_FEM);
            story += `${pronounHis[0].toUpperCase() + pronounHis.slice(1)} детство прошло в атмосфере, где ${pronounHe} ${childhood}. `;
        } else {
            story += `Младенец только появился на свет. `;
        }
        
        // Образование (только если возраст >= 7 лет)
        if (age >= 7) {
            const education = randomItem(isMale ? EDUCATION_MASC : EDUCATION_FEM);
            story += `${pronounHe[0].toUpperCase() + pronounHe.slice(1)} ${education}. `;
        } else if (age >= 3) {
            story += `${pronounHe[0].toUpperCase() + pronounHe.slice(1)} ходит в детский сад. `;
        }
        
        // Профессия (только для возраста >= 18)
        if (age >= 18) {
            story += `По профессии ${pronounHe} — ${profession}. `;
        } else if (age >= 7 && age < 18) {
            story += `${pronounHe[0].toUpperCase() + pronounHe.slice(1)} ${profession}. `;
        }
        
        // Работа (только если возраст >= 18)
        if (age >= 20) {
            const job = randomItem(isMale ? JOBS_MASC : JOBS_FEM);
            story += `В трудовой биографии ${pronounHe} ${job}. `;
        }
        
        // Семья (только если возраст >= минимального для выбранного варианта)
        if (age >= 18) {
            let familyOptions = isMale ? FAMILY_MASC : FAMILY_FEM;
            let validFamily = familyOptions.filter(f => age >= f.minAge);
            if (validFamily.length > 0) {
                const familyObj = randomItem(validFamily);
                story += `В личной жизни ${pronounHe} ${familyObj.text}. `;
                // Флаг наличия детей сохраняем для дальнейшего использования
                var hasChildren = familyObj.hasChildren;
            } else {
                var hasChildren = false;
            }
        } else {
            var hasChildren = false;
        }
        
        // Достижения (только если возраст > 25)
        if (age > 25) {
            const achievement = randomItem(isMale ? ACHIEVEMENTS_MASC : ACHIEVEMENTS_FEM);
            story += `Среди ${pronounHis} достижений: ${achievement}. `;
        }
        
        // Здоровье (только если возраст > 5)
        if (age > 5) {
            const health = randomItem(isMale ? HEALTH_MASC : HEALTH_FEM);
            story += `Здоровье: ${health}. `;
        } else {
            story += `Здоровье: обычное для младенца. `;
        }
        
        // Смерть или текущий возраст
        if (died) {
            const cause = randomItem(isMale ? DEATH_CAUSES_MASC : DEATH_CAUSES_FEM);
            story += `В возрасте ${age} лет ${pronounHe} ${cause}.`;
        } else {
            story += `На данный момент ${pronounHim} ${age} лет, и ${pronounHe} продолжает жить полной жизнью.`;
        }
        
        // Фраза про взрослых детей (только если есть дети, возраст > 30, персонаж жив и дети точно были)
        if (hasChildren && age > 30 && !died) {
            story += ` ${pronounHis[0].toUpperCase() + pronounHis.slice(1)} дети уже взрослые и живут своей жизнью.`;
        }
        return story;
    }

    function generatePerson(includeMiddle) {
        const { full, firstName, lastName, isFemale } = generateName(includeMiddle);
        const { age, died } = generateAgeAndDeath();
        const gender = isFemale ? "female" : "male";
        const profession = generateProfession(age, gender);
        const hobby = generateHobby(age);
        const personality = generatePersonality();
        const appearance = generateAppearance(age);
        const story = generateStory(firstName, lastName, gender, age, died, profession);
        return { fullName: full, age, profession, hobby, personality, appearance, story };
    }

    function refreshPerson() {
        const includeMid = document.getElementById("includeMiddleCheckbox").checked;
        const person = generatePerson(includeMid);
        document.getElementById("fullName").innerText = person.fullName;
        document.getElementById("ageValue").innerText = person.age;
        document.getElementById("profession").innerText = person.profession;
        document.getElementById("hobby").innerText = person.hobby;
        document.getElementById("personality").innerText = person.personality;
        document.getElementById("appearance").innerText = person.appearance;
        document.getElementById("storyText").innerHTML = person.story;
    }

    document.getElementById("generateBtn").addEventListener("click", refreshPerson);
    document.getElementById("includeMiddleCheckbox").addEventListener("change", refreshPerson);
    refreshPerson();
</script>
</body>
</html>
